name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional app version (leave empty for automatic numbering)
        required: false
        default: ''
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: world-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.signing.outputs.ready }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Prepare automatic versions and update address
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-release.mjs
      - name: Build offline frontend
        run: |
          npm ci
          npm test
          npm run build
          node scripts/stamp-bundled-content.mjs
          node scripts/generate-precache.mjs
      - name: Build installable test APK and run Android lint
        run: gradle -p android --no-daemon assembleDebug lintDebug
      - name: Prepare test APK artifact
        run: |
          mkdir -p apk-artifacts/debug
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-artifacts/debug/world-game-debug.apk
          cd apk-artifacts/debug
          sha256sum world-game-debug.apk > world-game-debug.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: world-game-debug-apk
          path: apk-artifacts/debug/
          if-no-files-found: error
          retention-days: 30
      - name: Load permanent signing identity
        id: signing
        if: github.event_name != 'pull_request'
        env:
          WORLD_GAME_SIGNING: ${{ secrets.WORLD_GAME_SIGNING }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-signing.mjs
      - name: Build and verify signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          gradle -p android --no-daemon assembleRelease
          mkdir -p apk-artifacts/release
          cp android/app/build/outputs/apk/release/app-release.apk apk-artifacts/release/world-game.apk
          keytool -exportcert -rfc -alias "$ANDROID_KEY_ALIAS" -keystore "$ANDROID_KEYSTORE_PATH" -storetype "$ANDROID_KEYSTORE_TYPE" -storepass:env ANDROID_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/world-game-release-cert.pem"
          node scripts/verify-release-apk.mjs
          cp "$RUNNER_TEMP/world-game-release-cert.pem" apk-artifacts/release/world-game-certificate.pem
          cd apk-artifacts/release
          sha256sum world-game.apk > world-game.apk.sha256
      - name: Prepare matching update manifest
        if: steps.signing.outputs.ready == 'true'
        run: |
          node scripts/prepare-updates.mjs --base-url="$CONTENT_BASE_URL" --content-version="$CONTENT_VERSION" --min-app-version-code="$APP_VERSION_CODE" --app-version="$APP_VERSION" --app-version-code="$APP_VERSION_CODE" --apk=apk-artifacts/release/world-game.apk --apk-url="$APK_RELEASE_URL" --output=apk-artifacts/release/release-manifest.json
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.ready == 'true'
        with:
          name: world-game-signed-release-apk
          path: apk-artifacts/release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral signing files
        if: always()
        run: rm -f -- "$RUNNER_TEMP/world-game-release.p12" "$RUNNER_TEMP/world-game-release.jks"

  publish:
    needs: apk
    if: needs.apk.outputs.signed == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: world-game-signed-release-apk
          path: release-files
      - name: Publish verified APK and update manifest together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.apk.outputs.tag }}
          APP_VERSION: ${{ needs.apk.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          printf 'מסע בעולם — אפליקציה חתומה עם כל התמונות והמוזיקה המקומיות.\n\nעדכונים מתקינים מעל הגרסה החתומה הקודמת, בכפוף לאישור Android.\n' > release-notes.txt
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "מסע בעולם $APP_VERSION" --notes-file release-notes.txt --draft
          gh release upload "$RELEASE_TAG" release-files/world-game.apk release-files/world-game.apk.sha256 release-files/release-manifest.json release-files/world-game-certificate.pem
          gh release edit "$RELEASE_TAG" --draft=false --latest
          printf 'Published signed release.\n\nWhatsApp link: https://github.com/%s/releases/latest/download/world-game.apk\n' "$GH_REPO" >> "$GITHUB_STEP_SUMMARY"
